<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выбор экрана</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, 'Segoe UI', sans-serif;
        --bg: #0f1115;
        --panel: #1a1d24;
        --border: #2a2f3a;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #4f8ff7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        padding: 1rem 1.25rem;
        font-size: 13px;
        display: flex;
        flex-direction: column;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        font-weight: 600;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 0.35rem 0.85rem;
        border-radius: 6px;
      }
      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 0.75rem;
      }
      .scroll {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      h2 {
        margin: 0.5rem 0 0.5rem;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.65rem;
        margin-bottom: 1rem;
      }
      .card {
        border: 2px solid transparent;
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
        cursor: pointer;
        text-align: left;
        padding: 0;
        display: block;
        width: 100%;
      }
      .card:hover {
        border-color: var(--border);
      }
      .card.selected {
        border-color: var(--accent);
      }
      .card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #000;
        display: block;
      }
      .card .cap {
        padding: 0.45rem 0.5rem;
        font-size: 12px;
        line-height: 1.3;
        color: var(--text);
        border-top: 1px solid var(--border);
      }
      .error {
        color: #e85d5d;
        margin-top: 0.5rem;
      }
      .empty {
        color: var(--muted);
        padding: 1rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Что показывать</h1>
    <p class="hint">Выберите монитор или окно. Системный звук (если включён) добавится после выбора.</p>
    <div class="toolbar">
      <button type="button" id="btn-cancel">Отмена</button>
      <button type="button" class="primary" id="btn-share" disabled>Поделиться</button>
    </div>
    <div id="err" class="error" hidden></div>
    <div class="scroll" id="scroll">
      <div id="loading" class="empty">Загрузка источников…</div>
    </div>
    <script type="module" src="./display-picker.js"></script>
  </body>
</html>
