<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демонстрация экрана — Sharkord</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #252525;
        --foreground: #fafafa;
        --card: #2e2e2e;
        --secondary: #3a3a3a;
        --muted-foreground: #a1a1aa;
        --primary: #fafafa;
        --primary-foreground: #171717;
        --border: rgba(255, 255, 255, 0.1);
        --ring: #7c6cf0;
        --destructive: #f87171;
        --radius: 10px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--background);
        color: var(--foreground);
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }

      .header {
        display: flex;
        align-items: flex-start;
        gap: 0.875rem;
        padding: 1.25rem 1.5rem 1rem;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .header-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: calc(var(--radius) - 2px);
        background: color-mix(in srgb, var(--ring) 18%, transparent);
        color: var(--ring);
        flex-shrink: 0;
      }

      .header-icon svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      .header-text h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .header-text p {
        margin: 0.25rem 0 0;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }

      .error-banner {
        margin: 0.75rem 1.5rem 0;
        padding: 0.625rem 0.875rem;
        border-radius: calc(var(--radius) - 2px);
        border: 1px solid color-mix(in srgb, var(--destructive) 35%, transparent);
        background: color-mix(in srgb, var(--destructive) 12%, transparent);
        color: #fecaca;
        font-size: 0.8125rem;
        flex-shrink: 0;
      }

      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 1rem 1.5rem;
      }

      .content::-webkit-scrollbar {
        width: 8px;
      }

      .content::-webkit-scrollbar-thumb {
        background: var(--secondary);
        border-radius: 999px;
      }

      .section {
        margin-bottom: 1.25rem;
      }

      .section:last-child {
        margin-bottom: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }

      .section-title svg {
        width: 0.95rem;
        height: 0.95rem;
        opacity: 0.85;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
        gap: 0.75rem;
      }

      .card {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .card:hover {
        border-color: color-mix(in srgb, var(--ring) 45%, var(--border));
        background: color-mix(in srgb, var(--secondary) 70%, var(--card));
      }

      .card:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent);
      }

      .card.selected {
        border-color: var(--ring);
        background: color-mix(in srgb, var(--ring) 10%, var(--card));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--ring) 55%, transparent);
      }

      .card-thumb {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #111;
        overflow: hidden;
      }

      .card-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-check {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 1.375rem;
        height: 1.375rem;
        border-radius: 999px;
        background: var(--ring);
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .card.selected .card-check {
        display: flex;
      }

      .card-check svg {
        width: 0.8rem;
        height: 0.8rem;
      }

      .card-cap {
        padding: 0.625rem 0.75rem;
        font-size: 0.8125rem;
        font-weight: 500;
        line-height: 1.35;
        color: var(--foreground);
        border-top: 1px solid var(--border);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .empty,
      .loading-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        min-height: 12rem;
        color: var(--muted-foreground);
        text-align: center;
        font-size: 0.875rem;
      }

      .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
        gap: 0.75rem;
      }

      .skeleton-card {
        border-radius: var(--radius);
        border: 1px solid var(--border);
        overflow: hidden;
        background: var(--card);
      }

      .skeleton-thumb {
        aspect-ratio: 16 / 9;
        background: linear-gradient(
          90deg,
          var(--secondary) 0%,
          color-mix(in srgb, var(--secondary) 60%, var(--card)) 50%,
          var(--secondary) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s ease-in-out infinite;
      }

      .skeleton-cap {
        height: 2.5rem;
        margin: 0.625rem 0.75rem;
        border-radius: 6px;
        background: var(--secondary);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.625rem;
        padding: 1rem 1.5rem 1.25rem;
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--card) 40%, var(--background));
        flex-shrink: 0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        height: 2.25rem;
        padding: 0 1rem;
        border-radius: calc(var(--radius) - 2px);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          opacity 0.15s ease;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-outline {
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--secondary) 35%, transparent);
        color: var(--foreground);
      }

      .btn-outline:hover:not(:disabled) {
        background: var(--secondary);
      }

      .btn-primary {
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-foreground);
      }

      .btn-primary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--primary) 90%, #000);
      }

      .btn svg {
        width: 1rem;
        height: 1rem;
      }

      .btn-primary.is-loading svg {
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
        </div>
        <div class="header-text">
          <h1>Демонстрация экрана</h1>
          <p>Выберите монитор или окно. Системный звук подключится автоматически, если он включён в настройках.</p>
        </div>
      </header>

      <div id="err" class="error-banner" hidden></div>

      <main class="content" id="scroll">
        <div id="loading" class="loading-text">
          <div class="skeleton-grid" style="width: 100%">
            <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-cap"></div></div>
            <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-cap"></div></div>
            <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-cap"></div></div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <button type="button" class="btn btn-outline" id="btn-cancel">Отмена</button>
        <button type="button" class="btn btn-primary" id="btn-share" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
            <polyline points="16 6 12 2 8 6" />
            <line x1="12" y1="2" x2="12" y2="15" />
          </svg>
          <span id="btn-share-label">Начать демонстрацию</span>
        </button>
      </footer>
    </div>
    <script type="module" src="./display-picker.js"></script>
  </body>
</html>
